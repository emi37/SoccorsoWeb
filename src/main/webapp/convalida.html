<!doctype html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Esito della convalida - Successo</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
    <main class="card-container">
        <header>
            <h1 class="section-title text-success">La sua richiesta è stata convalidata con successo!</h1>
        </header>
        <section>
            <p>Stato attuale: <strong>ATTIVA</strong></p>
            <p class="text-muted">Stiamo preparando i soccorsi, la centrale operativa ha preso in carico la segnalazione.</p>
            
            <!-- Feedback visivo per il redirect automatico -->
            <p class="text-muted" id="messaggioRedirect">
                <small>Ritorno automatico alla home tra <span id="countdown" style="font-weight: bold; color: #007bff;">5</span> secondi...</small>
            </p>
        </section>
        <hr class="mt-20 mb-24">
        <footer>
            <!-- Il bottone ora punta al file corretto del tuo progetto -->
            <a href="homeFinale.html" class="btn">Torna alla Home Page</a>
        </footer>
    </main>

    <!-- SCRIPT INTEGRATO: Gestisce il timer e il reindirizzamento senza dipendere da file esterni rotti -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let tempoRimanente = 5;
            const displayContoAllaRovescia = document.getElementById('countdown');
            
            const intervallo = setInterval(function() {
                tempoRimanente--;
                displayContoAllaRovescia.textContent = tempoRimanente;
                
                if (tempoRimanente <= 0) {
                    clearInterval(intervallo);
                    // Raggiunto lo zero, reindirizza al file corretto!
                    window.location.href = "homeFinale.html";
                }
            }, 1000);
        });
    </script>
</body>
</html>
